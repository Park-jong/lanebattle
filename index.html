<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>꼬마 무당 대소동</title>
  <!-- 홈 화면에 추가하면 주소창 없이 전체화면으로 열린다 (아이폰 사파리 대체) -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1b1d26" />
  <style>
    /* 모바일: 스크롤·확대·당겨서 새로고침·길게 눌러 선택/메뉴를 모두 막는다 */
    html, body {
      margin: 0; height: 100%; background: #1b1d26; overflow: hidden;
      position: fixed; width: 100%;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { width: 100vw; height: 100vh; touch-action: none; }
    canvas { touch-action: none; -webkit-user-drag: none; }
    /* 세로 화면 안내 (게임 위를 덮는다) */
    #rotate-notice {
      display: none; position: fixed; inset: 0; z-index: 1000;
      align-items: center; justify-content: center; flex-direction: column; gap: 16px;
      background: radial-gradient(ellipse at 50% 30%, #304b60, #111a2b 75%); color: #f4e9cf; text-align: center;
      font-family: "Malgun Gothic", system-ui, sans-serif;
    }
    #rotate-notice .icon { font-size: 64px; color: #e8bd69; }
    #rotate-notice .text { font-size: 22px; font-weight: bold; padding: 20px 28px; border: 1px solid #64788a; border-radius: 12px; background: #1c2a3c; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-notice"><div class="icon">&#x21BB;</div><div class="text">화면을 가로로 돌려 주세요</div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
