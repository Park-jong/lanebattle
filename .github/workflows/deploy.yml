# GitHub Pages 배포 (브랜치 방식)
# main에 push하면 테스트 → 빌드 → dist/ 내용을 gh-pages 브랜치에 올린다.
# 저장소 Settings → Pages → Source를 "Deploy from a branch", 브랜치 gh-pages / (root)로 설정하면 서비스된다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write # gh-pages 브랜치에 push

# 배포가 겹치면 진행 중인 배포는 끝까지 두고 다음 것을 대기시킨다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # gh-pages 브랜치는 빌드 결과만 담는 브랜치라 매번 새로 만들어 덮어쓴다
      - name: Push dist to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
